name: Test GPT Yar commerce
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check supabase/functions/gptyar-api/index.ts
